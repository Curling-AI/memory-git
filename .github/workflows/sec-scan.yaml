# Trivy security scan (PLA-410): dependency CVEs and secrets in the code.
# Fails on CRITICAL/HIGH CVEs with a fix, and on secrets of any severity.
# Not a required check: it shows the result but never blocks a merge.
# Exceptions: .trivyignore.yaml at the repo root (id, paths, statement, expired_at).
name: sec-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Security baseline expiry
        if: ${{ hashFiles('.trivyignore.yaml') != '' }}
        run: |
          today=$(date -u +%F)
          for d in $(grep -oE 'expired_at: *[0-9]{4}-[0-9]{2}-[0-9]{2}' .trivyignore.yaml | grep -oE '[0-9-]{10}' | sort -u); do
            if [[ ! "$d" > "$today" ]]; then
              echo "::error title=Security baseline expired::Exceptions that expired on $d no longer apply: their findings now fail this check (security block)."
            else
              echo "::warning title=Security baseline::Exceptions expire on $d. After that date their findings fail this check (security block). Fix them before then."
            fi
          done
      - name: Trivy - CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: ${{ hashFiles('.trivyignore.yaml') != '' && '.trivyignore.yaml' || '' }}
          exit-code: "1"
      - name: Trivy - secrets
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          scan-type: fs
          scanners: secret
          trivyignores: ${{ hashFiles('.trivyignore.yaml') != '' && '.trivyignore.yaml' || '' }}
          exit-code: "1"
